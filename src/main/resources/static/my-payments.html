<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Payments - MilkMate</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .header {
            background: #176b3a;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
        }

        .back-btn {
            background: white;
            color: #176b3a;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            padding: 30px;
        }

        .summary {
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            max-width: 350px;
        }

        .card h3 {
            margin: 0 0 10px;
            color: #555;
        }

        .card p {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
            color: #176b3a;
        }

        .table-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #176b3a;
            color: white;
        }

        tr:hover {
            background: #f4f8f5;
        }

        .message {
            margin: 15px 0;
            color: #d92d20;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .container {
                padding: 15px;
            }

            .header {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="header">

        <h2>My Payments</h2>

        <button class="back-btn"
                onclick="window.location.href='/farmer-dashboard.html'">
            ← Dashboard
        </button>

    </div>


    <div class="container">

        <div class="summary">

            <div class="card">

                <h3>Total Paid</h3>

                <p id="totalPaid">₹0</p>

            </div>

        </div>


        <div class="table-card">

            <h2>Payment History</h2>

            <div id="message" class="message"></div>

            <table>

                <thead>

                    <tr>
                        <th>Payment Date</th>
                        <th>Amount</th>
                        <th>Payment Mode</th>
                        <th>Reference Number</th>
                        <th>Notes</th>
                    </tr>

                </thead>

                <tbody id="paymentTableBody">

                </tbody>

            </table>

        </div>

    </div>


    <script src="/js/my-payments.js"></script>

</body>

</html>
