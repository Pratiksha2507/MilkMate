<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Milk Collection - MilkMate</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .header {
            background: #176b3a;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
        }

        .back-btn {
            background: white;
            color: #176b3a;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            padding: 30px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin: 0 0 10px;
            color: #555;
        }

        .card p {
            font-size: 26px;
            font-weight: bold;
            margin: 0;
            color: #176b3a;
        }

        .table-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #176b3a;
            color: white;
        }

        tr:hover {
            background: #f4f8f5;
        }

        .message {
            margin: 15px 0;
            color: #d92d20;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .container {
                padding: 15px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="header">

        <h2>My Milk Collection</h2>

        <button class="back-btn"
                onclick="window.location.href='/farmer-dashboard.html'">
            ← Dashboard
        </button>

    </div>


    <div class="container">

        <div class="summary">

            <div class="card">
                <h3>Total Milk</h3>
                <p id="totalMilk">0 L</p>
            </div>

            <div class="card">
                <h3>Total Amount</h3>
                <p id="totalAmount">₹0</p>
            </div>

        </div>


        <div class="table-card">

            <h2>Milk Collection Records</h2>

            <div id="message" class="message"></div>

            <table>

                <thead>

                    <tr>
                        <th>Date</th>
                        <th>Session</th>
                        <th>Quantity (L)</th>
                        <th>Fat</th>
                        <th>SNF</th>
                        <th>Rate</th>
                        <th>Amount</th>
                    </tr>

                </thead>

                <tbody id="milkTableBody">

                </tbody>

            </table>

        </div>

    </div>


    <script src="/js/my-milk-collection.js"></script>

</body>

</html>
