<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Notifications - MilkMate</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .header {
            background: #176b3a;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
        }

        .back-btn {
            background: white;
            color: #176b3a;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-section h1 {
            margin: 0;
            color: #176b3a;
        }

        .read-all-btn {
            background: #176b3a;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .notification-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notification {
            background: white;
            padding: 20px;

            border-radius: 10px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);

            border-left: 5px solid #176b3a;
        }

        .notification.unread {
            background: #eef8f1;
        }

        .notification-title {
            font-size: 18px;
            font-weight: bold;
            color: #176b3a;
            margin-bottom: 8px;
        }

        .notification-message {
            color: #444;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .notification-date {
            color: #888;
            font-size: 13px;
        }

        .notification-type {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 8px;
            background: #e5f2e9;
            color: #176b3a;
            border-radius: 4px;
            font-size: 12px;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            color: #777;
        }

        .message {
            color: #d92d20;
            font-weight: bold;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {

            .header {
                padding: 15px;
            }

            .container {
                padding: 15px;
            }

            .top-section {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <div class="header">

        <h2>MilkMate - Notifications</h2>

        <button
            class="back-btn"
            onclick="window.location.href='/farmer-dashboard.html'">

            ← Dashboard

        </button>

    </div>



    <div class="container">


        <div class="top-section">

            <h1>
                My Notifications
            </h1>

            <button
                id="readAllBtn"
                class="read-all-btn">

                Mark All as Read

            </button>

        </div>


        <div
            id="message"
            class="message">
        </div>


        <div
            id="notificationList"
            class="notification-list">
        </div>


    </div>


    <script src="/js/farmer-notifications.js"></script>

</body>

</html>
